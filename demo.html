<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SIIZ — Démonstration</title>
<style>
:root{--teal:#006c77;--gold:#ffad17;--ink:#102e35;--paper:#f6f7f7}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:var(--paper);color:var(--ink);overflow:hidden}
.stage{min-height:100dvh;display:grid;place-items:center;padding:20px}.phone{position:relative;width:min(390px,calc(100vw - 44px),calc((100dvh - 76px)*.465));aspect-ratio:393/852;border:7px solid #202328;background:#fff;border-radius:55px;box-shadow:0 25px 70px #15292d22,0 1px 4px #101a1f44;overflow:hidden}
.phone:before{content:"";position:absolute;z-index:30;width:31%;height:26px;background:#151619;border-radius:0 0 18px 18px;top:0;left:34.5%}.screen{position:absolute;inset:0;background:white;overflow:hidden;border-radius:46px}.app{position:absolute;width:100%;height:100%;border:0;inset:0;background:white}.splash{position:absolute;z-index:20;inset:0;background:white;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .55s ease,visibility .55s}.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.mark{width:116px;height:150px;display:block;animation:enter .75s cubic-bezier(.2,.7,.3,1) both}.brand{font-size:45px;font-weight:700;letter-spacing:-.055em;color:var(--teal);margin:11px 0 8px;line-height:1.1}.tag{font-size:13px;letter-spacing:-.015em;font-weight:500;color:var(--teal)}.progress{width:78px;height:2px;background:#e5ebec;border-radius:2px;margin-top:30px;overflow:hidden}.progress>div{height:100%;width:0;background:var(--gold);animation:load 2.9s linear forwards}
@keyframes load{to{width:100%}}@keyframes enter{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.footer{position:fixed;left:42px;bottom:30px;font-size:12px;letter-spacing:.035em;font-weight:500;color:#69797e}.restart{position:fixed;right:35px;bottom:24px;background:transparent;border:1px solid #cbd4d5;padding:10px 14px;border-radius:100px;color:var(--ink);font:inherit;font-size:12px;cursor:pointer}.restart:hover{background:white}.fallback{position:absolute;inset:0;z-index:0;display:flex;align-items:end;justify-content:center;pointer-events:none}.fallback a{pointer-events:auto;display:block;margin-bottom:36px;background:var(--teal);color:white;text-decoration:none;border-radius:20px;padding:10px 14px;font-size:12px}
@media(max-width:700px){.footer{left:20px;bottom:14px}.restart{right:16px;bottom:9px}.phone{width:min(390px,calc(100vw - 34px),calc((100dvh - 76px)*.465))}}@media(prefers-reduced-motion:reduce){.mark,.progress>div{animation:none}.progress>div{width:100%}}
</style></head>
<body><main class="stage"><section class="phone" aria-label="Téléphone de démonstration SIIZ"><div class="screen"><div class="fallback"><a href="https://yannick220.github.io/siiz/SIIZ_simulation_pure_v48.html" target="_blank" rel="noopener">Ouvrir la simulation directement</a></div>
<iframe class="app" title="Simulation interactive de SIIZ" src="https://yannick220.github.io/siiz/SIIZ_simulation_pure_v48.html" allow="geolocation 'none'; camera 'none'; microphone 'none'"></iframe>
<div class="splash" id="splash"><svg class="mark" viewBox="0 0 140 170" aria-label="Logo SIIZ" role="img"><defs><clipPath id="pin"><path d="M70 5C34 5 10 31 10 66C10 107 42 130 70 162C98 130 130 107 130 66C130 31 106 5 70 5Z"/></clipPath></defs><path fill="#006c77" d="M70 5C34 5 10 31 10 66C10 107 42 130 70 162C98 130 130 107 130 66C130 31 106 5 70 5Z"/><g clip-path="url(#pin)"><path fill="#ffad17" d="M73 121 L73 170 L145 170 L145 80 C136 116 100 118 73 121Z"/></g><path d="M73 121 L73 161" stroke="white" stroke-width="2.5" fill="none"/><circle cx="70" cy="65" r="28" fill="white"/></svg><div class="brand">siiz</div><div class="tag">Le contact, à bonne distance.</div><div class="progress"><div></div></div></div></div></section></main>
<div class="footer">DÉMONSTRATION SIIZ</div><button class="restart" type="button" id="restart">↻ Rejouer</button>
<script>const splash=document.getElementById('splash');let timeout;function start(){splash.classList.remove('hide');clearTimeout(timeout);timeout=setTimeout(()=>splash.classList.add('hide'),3200)}document.getElementById('restart').addEventListener('click',start);start()</script></body></html>
