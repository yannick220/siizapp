<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffd400" />
  <title>SIIZ hors ligne</title>
  <style>
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      color: #111113;
      background: #fff;
      font-family: Montserrat, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(360px, calc(100vw - 44px));
      text-align: center;
    }
    .mark {
      display: inline-grid;
      width: 72px;
      height: 72px;
      margin-bottom: 20px;
      place-items: center;
      border-radius: 50%;
      background: #ffd400;
      font-weight: 800;
    }
    h1 { margin: 0 0 10px; font-size: 1.35rem; }
    p { margin: 0; color: rgba(17,17,19,.62); line-height: 1.55; }
  </style>
</head>
<body>
  <main>
    <div class="mark">SIIZ</div>
    <h1>SIIZ est hors ligne</h1>
    <p>La version installée reste disponible. Les comptes, contacts et messages se synchronisent dès que le réseau revient.</p>
  </main>
</body>
</html>
